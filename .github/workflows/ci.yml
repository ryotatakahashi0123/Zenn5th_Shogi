name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt -r engine_service/requirements.txt pytest
      # 将棋エンジン（やねうら王と評価関数）はリポジトリに含めないので、エンジンが要らない試験だけを回す。
      # test_engine_api.py と test_agent_flow.py は、README の手順でエンジンを用意した環境で実行する
      - run: >
          python -m pytest -q tests/test_regret.py tests/test_board_view.py tests/test_report.py
          tests/test_kifu_input.py tests/test_entry.py tests/test_learn_auth.py
