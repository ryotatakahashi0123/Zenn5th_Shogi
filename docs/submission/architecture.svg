  <rect x="680" y="215" width="250" height="120" rx="8" fill="#fff7e6" stroke="#333"/>
  <text x="805" y="245" text-anchor="middle" font-weight="bold">Cloud Storage</text><text x="695" y="272">・棋譜と結果（30日で削除）</text><text x="695" y="294">・利用者、設定</text><text x="695" y="316">・保存は本人が同意した対局だけ</text>
  <rect x="680" y="370" width="250" height="90" rx="8" fill="#fff7e6" stroke="#333"/>
  <text x="805" y="404" text-anchor="middle" font-weight="bold">Cloud Logging</text><text x="805" y="430" text-anchor="middle">道具の開始・終了・エラーの記録</text>
  <g stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M180 245 L273 215"/><path d="M415 300 L415 368"/><path d="M555 150 L678 135"/><path d="M555 225 L678 265"/><path d="M555 285 L678 400"/>
