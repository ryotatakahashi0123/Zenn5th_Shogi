  <text x="415" y="138" text-anchor="middle" font-weight="bold">shogi-web（公開）</text>
  <text x="290" y="166">・Streamlit の画面</text><text x="290" y="188">・ADK エージェント（AIエージェント）</text><text x="290" y="210">・印とエンジン判定の突き合わせ</text><text x="290" y="232">・ふりかえりノート（PDF）</text><text x="290" y="254">・ログイン（ハッシュで照合）</text><text x="290" y="276">・裏で進む 解析→ふりかえり→保存</text>
  <rect x="275" y="370" width="280" height="115" rx="8" fill="#fff" stroke="#333"/>
