  <text x="290" y="424">・FastAPI</text><text x="290" y="446">・やねうら王 + 水匠5</text><text x="290" y="468">・全手解析、深掘り、手の比較</text>
  <rect x="680" y="90" width="250" height="90" rx="8" fill="#fff7e6" stroke="#333"/>
