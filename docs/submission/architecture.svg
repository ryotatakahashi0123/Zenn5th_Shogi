  <rect x="250" y="70" width="330" height="440" rx="10" fill="#eef5ff" stroke="#3b6fb6" stroke-dasharray="6 4"/>
  <text x="266" y="94" fill="#3b6fb6" font-weight="bold">Cloud Run</text>
