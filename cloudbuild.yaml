# 2つのイメージをまとめてビルドする:
#   gcloud builds submit --config cloudbuild.yaml --substitutions _REGION=asia-northeast1,_REPO=shogi
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "engine_service/Dockerfile",
           "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/shogi-engine:${_TAG}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "web.Dockerfile",
           "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/shogi-web:${_TAG}", "."]
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/shogi-engine:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/shogi-web:${_TAG}
substitutions:
  _REGION: asia-northeast1
  _REPO: shogi
  _TAG: latest
options:
  machineType: E2_HIGHCPU_8   # やねうら王のビルドを速くする
timeout: 1800s
